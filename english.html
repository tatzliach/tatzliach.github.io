<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Learning Path</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">

<style>
/* ===== Body & Background ===== */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  text-align: center;
  color: white;
  background: linear-gradient(to bottom, #ff4d6d, #c9184a, #a4133c, #590d22);
  overflow-x: hidden;
}

/* ===== Moving Stars Background ===== */
.stars {
  position: fixed;
  width: 100%;
  height: 100%;
  background: url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
  animation: moveStars 200s linear infinite;
  z-index: 0;
}

@keyframes moveStars {
  from { background-position: 0 0; }
  to { background-position: -10000px 5000px; }
}

/* ===== Main Content ===== */
main {
  position: relative;
  z-index: 2;
  padding: 100px 20px 80px 20px;
}

.title {
  font-size: 2.8rem;
  font-weight: bold;
  margin-bottom: 20px;
  text-shadow: 0 0 20px rgba(255,255,255,0.8);
}

.subtitle {
  font-size: 1.1rem;
  margin-bottom: 60px;
  opacity: 0.95;
}

/* ===== Topic Buttons ===== */
.topic-btn {
  display: block;
  width: 94%;
  max-width: 720px;
  margin: 28px auto;
  padding: 28px;
  border-radius: 35px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(25px);
  text-decoration: none;
  color: white;
  font-size: 1.2rem;
  font-weight: bold;
  transition: all 0.4s ease;
}

.topic-btn:hover {
  transform: translateY(-15px) scale(1.08);
  background: rgba(255,255,255,0.35);
}

/* ===== Back Button ===== */
.back-btn {
  display: inline-block;
  margin-top: 40px;
  padding: 12px 25px;
  border-radius: 20px;
  background: white;
  color: #c9184a;
  font-weight: bold;
  text-decoration: none;
  transition: all 0.3s ease;
}

.back-btn:hover {
  background: #ffe5ec;
}
</style>
</head>

<body>
  <!-- Stars Background -->
  <div class="stars"></div>

  <main class="container">
    <!-- Page Header -->
    <div class="title">📚 English Learning Path</div>
    <div class="subtitle">
      Select your English mastery program and start your journey today.
    </div>

    <!-- Topic Buttons -->
    <a href="60days.html" class="topic-btn">📘 60 Days English Learning Target</a>
    <a href="200days.html" class="topic-btn">📖 Necessary Vocabularies</a>
    <a href="#" class="topic-btn">🗣 Necessary Idioms</a>
    <a href="#" class="topic-btn">🔤 Necessary Phrasal Verbs</a>
    <a href="#" class="topic-btn">😊 Feelings and Emotions</a>
    <a href="#" class="topic-btn">✍ Grammar and Compositions</a>

    <!-- Back Button -->
    <a href="index.html" class="back-btn">⬅ Back to Home</a>
  </main>
</body>
</html>
