<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tatzliach Education</title>

  <!-- Pico.css -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
  <script src="https://kit.fontawesome.com/4e5f3b7f3a.js" crossorigin="anonymous"></script>

  <style>
    /* ===== Body & Background ===== */
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
      background: linear-gradient(to bottom, #87cefa, #87ceeb, #00bfff, #1e90ff);
      overflow-x: hidden;
      position: relative;
    }

    /* ===== Twinkling Stars ===== */
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle 3s infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    .stars-container {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ===== Logo ===== */
    .logo {
      width: 100px;
      margin-top: 60px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
      animation: float 3s ease-in-out infinite;
      position: relative;
      z-index: 2;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* ===== Header ===== */
    .site-title {
      font-size: 2.3rem;
      font-weight: bold;
      margin-top: 20px;
      position: relative;
      z-index: 2;
    }

    .tagline {
      font-size: 1.2rem;
      margin-bottom: 45px;
      opacity: 0.9;
      position: relative;
      z-index: 2;
    }

    /* ===== Topics ===== */
    .topic-box {
      display: block;
      width: 92%;
      max-width: 600px;
      margin: 20px auto;
      padding: 25px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      text-decoration: none;
      transition: all 0.4s ease;
      position: relative;
      z-index: 2;
    }

    .topic-box:hover {
      transform: translateY(-10px) scale(1.05);
      background: rgba(255, 255, 255, 0.2);
    }

    /* ===== Social Icons ===== */
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 40px;
      font-size: 35px;
      margin: 50px 0 30px 0;
      position: relative;
      z-index: 2;
    }

    .social-icons a {
      transition: transform 0.3s;
    }

    .social-icons a:hover {
      transform: scale(1.3);
    }

    .instagram { color: #E1306C; }
    .facebook { color: #1877F2; }
    .twitter { color: #1DA1F2; }

    /* ===== Footer ===== */
    footer {
      opacity: 0.85;
      position: relative;
      z-index: 2;
      text-align: center;
    }
  </style>
</head>

<body>
  <!-- Stars -->
  <div class="stars-container"></div>
  <script>
    const starsContainer = document.querySelector('.stars-container');
    for (let i = 0; i < 50; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      star.style.top = Math.random() * 100 + '%';
      star.style.left = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      starsContainer.appendChild(star);
    }
  </script>

  <main class="container">
    <!-- Logo & Header -->
    <img src="https://i.postimg.cc/8zfGyH8s/grok-image-kj6956.jpg" class="logo" alt="Logo">
    <div class="site-title">Tatzliach Education</div>
    <div class="tagline">Follow the Path of Success</div>

    <!-- Topics -->
    <a href="english.html" class="topic-box">📘 Learn English with Clarity</a>
    <a href="math.html" class="topic-box">📐 Learn Mathematics with Concept</a>
    <a href="#" class="topic-box">🔬 Learn Science with Curiosity</a>
    <a href="wisdom.html" class="topic-box">🧠 Increase Your Wisdom</a>
  </main>

  <!-- Footer -->
  <footer class="container">
    <div class="social-icons">
      <a href="https://www.instagram.com/" target="_blank" class="instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://www.facebook.com/" target="_blank" class="facebook"><i class="fab fa-facebook"></i></a>
      <a href="https://www.twitter.com/" target="_blank" class="twitter"><i class="fab fa-twitter"></i></a>
    </div>
    <small>© 2026 Tatzliach Education</small>
  </footer>
</body>
</html>
